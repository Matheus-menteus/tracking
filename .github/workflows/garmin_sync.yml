name: Sincronizar Garmin Personal API

on:
  schedule:
    - cron: '0 11,16,23 * * *' # Roda sozinho às 08h, 13h e 20h (Horário de Brasília)
  workflow_dispatch: # Permite acionar com 1 clique de dentro do seu Painel!

permissions:
  contents: write

jobs:
  sync-garmin-api:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Repositório
        uses: actions/checkout@v4

      - name: Executar Extração Direta via Garmin Personal API
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python3 sync_garmin.py

      - name: Gravar Dados no memoria.json
        run: |
          git config user.name "Garmin API Bot"
          git config user.email "bot@github.com"
          git add memoria.json
          git diff --staged --quiet || git commit -m "⌚ Sync direto via Garmin Personal API"
          git push
